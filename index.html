<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>

    <div class="container" data-active="false">

        <div class="heading">
            <h1>Tic Tac Toe</h1>
        </div>
        
        <div class="player-inputs" data-state="pregame">
            <input type="text" name="first-player" id="first-player">
            <input type="text" name="second-player" id="second-player">
            <button type="submit">Create Game</button>
        </div>

        <div class="gameboard">

        </div>
        <div class="score">

        </div>
        <div class="reset-gameboard">

        </div>

        <div class="reset-whole-game-section">
            <button class="reset-whole-game">Start New Game</button>
        </div>

    </div>

    
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    
    <div class="player-inputs">
        <input type="text" name="first-player" id="first-player">
        <input type="text" name="second-player" id="second-player">
        <button type="submit">Create Players</button>
    </div>

    <div class="player-information">

    </div>

    <div class="buttons">
        <button class="player-one">Player One: Noughts</button>
        <button class="player-two">Player Two: Crosses</button>
    </div>

    <div class="gameboard">

    </div>
    <div class="score">

    </div>
    <div class="reset-gameboard">

    </div>

    <button class="reset-whole-game">Reset Everything</button>

    
</body>
</html>
